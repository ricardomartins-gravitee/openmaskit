name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify pinned shared design assets
        run: python3 scripts/design_system.py --check-upstream

      - name: Verify shared assets in the built Python distribution
        run: |
          uv build --wheel --out-dir .runtime/design-wheel
          python3 scripts/design_system.py --check-wheel .runtime/design-wheel/*.whl

      - name: Run tests
        # Skip the e2e suite — it lives in its own dependency group (pytest-playwright,
        # Chromium, Postgres URI) and runs in the acceptance job below.
        # Without --ignore, pytest still tries to import tests/e2e/* during collection
        # and fails on the playwright import even though the e2e marker would deselect them.
        run: >-
          uv run pytest tests/ -v --ignore=tests/e2e
          --junitxml=.runtime/backend-tests.xml
          --cov=openmaskit --cov-branch
          --cov-report=xml:.runtime/backend-coverage.xml
          --cov-report=json:.runtime/backend-coverage.json
          --cov-report=html:.runtime/backend-coverage

      - name: Save backend test and branch coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-coverage
          path: |
            .runtime/backend-tests.xml
            .runtime/backend-coverage.xml
            .runtime/backend-coverage.json
            .runtime/backend-coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Check privacy across real startup and MCP calls
        run: uv run --frozen python scripts/privacy_smoke.py

  acceptance:
    name: Browser and real Presidio acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acceptance
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: acceptance
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install test dependencies and browser
        run: |
          uv sync --frozen --group e2e --python 3.12
          uv run --frozen --group e2e playwright install --with-deps chromium
          uv venv --python 3.12 .runtime/presidio-test
          uv pip install --python .runtime/presidio-test/bin/python -r tests/e2e/requirements-presidio.txt
      - name: Prepare synthetic PostgreSQL fixture
        run: |
          docker pull crystaldba/postgres-mcp
          docker exec -i ${{ job.services.postgres.id }} psql -U acceptance -d acceptance <<'SQL'
          CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, email TEXT, phone_number TEXT);
          INSERT INTO users VALUES
            (1, 'John Krasinsky', 'user1@yahoo.com', NULL),
            (2, 'John Doe', 'john.doe@gmail.com', '+31611119987');
          SQL
      - name: Run browser and real-model privacy acceptance
        env:
          OM_E2E_PG_URI: postgresql://acceptance:synthetic-test-only@172.17.0.1:55439/acceptance
          PRESIDIO_TEST_PYTHON: ${{ github.workspace }}/.runtime/presidio-test/bin/python
        run: >-
          uv run --frozen --group e2e pytest tests/e2e -m e2e -v
          --basetemp=.runtime/acceptance
          --junitxml=.runtime/acceptance.xml
          --screenshot only-on-failure --tracing retain-on-failure --output .runtime/browser-results
      - name: Save acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-acceptance
          path: |
            .runtime/acceptance.xml
            .runtime/browser-results/
            .runtime/acceptance/**/privacy-mobile.png
          retention-days: 14
