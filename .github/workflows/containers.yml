name: Containers

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Tests, Maintain MCP privacy fork]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    if: >-
      github.repository == 'ricardomartins-gravitee/openmaskit' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      package_version: ${{ steps.meta.outputs.package_version }}
      image: ${{ steps.meta.outputs.image }}
      needed: ${{ steps.published.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Maintenance can advance main during its own run. Resolve that new
          # source once here, then both architecture jobs use the exact SHA.
          ref: ${{ github.event.workflow_run.name == 'Maintain MCP privacy fork' && 'main' || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: meta
        name: Resolve versioned source
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          version = project['version'].replace('+', '-')
          assert re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}', version), 'Invalid container version'
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha={sha}\nversion={version}\npackage_version={project['version']}\n")
              output.write("image=ghcr.io/" + os.environ['SOURCE_REPOSITORY'].lower() + "\n")
          PY

      - id: published
        name: Skip previously published source
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHA: ${{ steps.meta.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] &&
             docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" >/dev/null 2>&1 &&
             docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: source
    if: needs.source.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      PACKAGE_VERSION: ${{ needs.source.outputs.package_version }}
      CANDIDATE: openmaskit:candidate-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          version: '0.13.1'
      - uses: docker/setup-buildx-action@v3
      - name: Install locked validation dependencies
        run: uv sync --frozen --python 3.12
      - name: Run regression and native startup checks
        run: |
          uv run --frozen pytest tests/ -q --ignore=tests/e2e
          uv run --frozen python scripts/privacy_smoke.py
      - name: Build native architecture image
        run: >-
          docker buildx build --load --provenance=false --pull --tag "$CANDIDATE"
          --build-arg "OPENMASKIT_VERSION=$PACKAGE_VERSION"
          --build-arg "VCS_REF=$SOURCE_SHA" .
      - name: Validate Compose deployment with real Presidio and synthetic MCP
        run: |
          mkdir -p .runtime
          uv run --frozen python scripts/container_smoke.py --image "$CANDIDATE" > .runtime/container-acceptance.log 2>&1
      - name: Save tested image
        if: github.event_name != 'pull_request'
        run: docker save "$CANDIDATE" | gzip > .runtime/container-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: container-image-${{ matrix.arch }}
          path: .runtime/container-image.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-validation-${{ matrix.arch }}
          path: .runtime/container-acceptance.log
          retention-days: 7

  publish:
    needs: [source, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.source.outputs.image }}
      VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: container-image-*
          path: images
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images and multi-architecture manifest
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" >/dev/null 2>&1; then
            for arch in amd64 arm64; do
              gunzip -c "images/container-image-$arch/container-image.tar.gz" | docker load
              docker tag "openmaskit:candidate-$arch" "$IMAGE:sha-$SOURCE_SHA-$arch"
              docker push "$IMAGE:sha-$SOURCE_SHA-$arch"
            done
            docker buildx imagetools create --tag "$IMAGE:sha-$SOURCE_SHA" \
              "$IMAGE:sha-$SOURCE_SHA-amd64" "$IMAGE:sha-$SOURCE_SHA-arm64"
          fi
          # Version tags are assigned once; existing versions are never replaced.
          if ! docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:sha-$SOURCE_SHA"
          fi
          echo "Published $IMAGE:sha-$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Version alias: $IMAGE:$VERSION (first validated build of this version)" >> "$GITHUB_STEP_SUMMARY"
